<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1回 演習用サンプルサイト</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
         color:#1a1a1a; background:#fafafa; line-height:1.8; }
  .wrap { max-width:640px; margin:0 auto; padding:48px 20px 60px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  .lead { color:#555; margin:0 0 32px; }
  a.card { display:block; background:#fff; border:1px solid #e3e3e3; border-radius:8px;
           padding:20px 22px; margin-bottom:14px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:#0b5fa5; }
  a.card .label { font-size:1.15rem; font-weight:600; color:#0b5fa5; }
  a.card .desc { font-size:.9rem; color:#666; margin-top:4px; }
  .rule { margin-top:36px; padding:16px 18px; background:#fff;
          border-left:4px solid #0b5fa5; font-size:.92rem; }
  .rule strong { color:#0b5fa5; }
</style>
</head>
<body>
<div class="wrap">

<h1>第1回 演習①：採用担当の目で見る</h1>
<p class="lead">下の3つを、それぞれ<strong>2分だけ</strong>見てください。時間を測ること。</p>

<a class="card" href="a/"><span class="label">サンプル A</span>
  <div class="desc">2分だけ見て、ワークシートに記入する</div></a>
<a class="card" href="b/"><span class="label">サンプル B</span>
  <div class="desc">2分だけ見て、ワークシートに記入する</div></a>
<a class="card" href="c/"><span class="label">サンプル C</span>
  <div class="desc">2分だけ見て、ワークシートに記入する</div></a>

<div class="rule">
  <strong>2分しか見ないのは意図的です。</strong><br>
  実際の採用の場面でも、最初に見られるのはこの程度です。
  「じっくり見れば良さが分かる」は通用しません。<br><br>
  <strong>スマートフォンからも開いてください。</strong>PCで見た印象と変わるものがあります。
</div>

</div>
</body>
</html>
